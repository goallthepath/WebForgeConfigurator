# Lokale Entwicklungsumgebung der WebForge-Plattform.
# Staging und Produktion werden separat unter infrastructure/ beschrieben.

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME:-webforge}
      MARIADB_USER: ${DB_USER:-webforge}
      MARIADB_PASSWORD: ${DB_PASSWORD:-webforge_dev_only}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev_only}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-webforge}
      WORDPRESS_DB_USER: ${DB_USER:-webforge}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-webforge_dev_only}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', '${WP_ENVIRONMENT_TYPE:-local}');
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/wp-content/themes/webforge:/var/www/html/wp-content/themes/webforge
      - ./wordpress/wp-content/plugins/webforge-core:/var/www/html/wp-content/plugins/webforge-core
      - ./wordpress/wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins

  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-webforge}
      WORDPRESS_DB_USER: ${DB_USER:-webforge}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-webforge_dev_only}
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/wp-content/themes/webforge:/var/www/html/wp-content/themes/webforge
      - ./wordpress/wp-content/plugins/webforge-core:/var/www/html/wp-content/plugins/webforge-core
      - ./wordpress/wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  db_data:
  wp_data:
